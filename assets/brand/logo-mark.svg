<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">Apex Motor Works Badge</title>
  <desc id="desc">A precision mechanical apex emblem representing precision motorcycle service and repair.</desc>
  <g fill="none" stroke="#C45D32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer precision hexagon with corner accents -->
    <path d="M24 3.5 L42.5 14.2 V35.8 L24 46.5 L5.5 35.8 V14.2 Z" stroke-width="2.8"/>
    <!-- Apex Chevron / Letter A -->
    <path d="M24 10.5 L36 29 H12 Z" stroke-width="2.6"/>
    <!-- Mechanical Motor V-Angle / Letter M linkage -->
    <path d="M12 29 L24 39.5 L36 29" stroke-width="2.6"/>
    <!-- Central mechanical hub -->
    <circle cx="24" cy="22.5" r="2.8" fill="#C45D32" stroke="none"/>
    <path d="M24 29 V35.5" stroke-width="2.4"/>
    <path d="M17.5 21 L10 25.5" stroke-width="2.2"/>
    <path d="M30.5 21 L38 25.5" stroke-width="2.2"/>
  </g>
</svg>
